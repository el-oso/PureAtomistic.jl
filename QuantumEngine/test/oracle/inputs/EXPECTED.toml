# The outcome of `parse_input` on each vendored oracle input, in strict mode and with
# `lenient = true`, keyed by the file's path relative to this directory.
#
#   strict, lenient    "ok" or "error"
#   strict_message     a substring of the strict error message (strict = "error")
#   lenient_message    a substring of the lenient error message (lenient = "error")
#   lenient_warnings   the sorted case names of the lenient warnings (lenient = "ok")
#
# Each row is read from the oracle (`quantum_engine` at 4a78a1d), with the lines of its source
# cited in the row's reason. `parser.rs` is its `src/input/parser.rs`, `molecule.rs` its
# `src/io/molecule.rs`, `vdw.rs` its `src/dft/vdw.rs`, and `yaml.rs`, `scanner.rs` and
# `yaml_parser.rs` the files `src/yaml.rs`, `src/scanner.rs` and `src/parser.rs` of yaml-rust2
# 0.9.0, its YAML and JSON reader. A file the oracle reads without error and without a silently
# accepted line is "ok" in both modes with no warning. Lenient mode reproduces each silently
# accepted line with one warning of its case, and strict mode rejects the first one. A file the
# oracle reads into an input without atoms fails in both modes ("no atoms" in lenient mode).
#
# Shared citations: the first `#` line is the title (parser.rs:43-47); a keyword line matches
# its arm by its lowercased first token (parser.rs:55-57); `end` closes every block
# (parser.rs:369-376); an atom line inside a geometry block is read at parser.rs:576-600, in Å
# unless the block says `bohr` (parser.rs:307-318, 582-585); a word no arm matches, outside every
# block, falls through every branch of parser.rs:563-618 and is dropped.

