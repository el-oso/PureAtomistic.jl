[case.h2_qtaim]
input = '''
# Hydrogen molecule
charge 0
multiplicity 1
basis sto-3g
method rhf
scf_convergence 1e-6
max_iterations 50
run qtaim

geometry bohr
H   0.0   0.0  -0.7
H   0.0   0.0   0.7
end
'''
source = "derived from examples/h2.inp: `run qtaim` added as line 8"
command = "aimext"
extract = ["ext_report"]
exports = ["ext"]
tolerance = {"ext_report.bcp1.delta_r" = "qtaim.bcp1.delta_r", "ext_report.bcp1.ellipticity" = "qtaim.bcp1.ellipticity", "ext_report.bcp1.laplacian" = "qtaim.bcp1.laplacian", "ext_report.bcp1.r_b" = "qtaim.bcp1.r_b", "ext_report.bcp1.r_e" = "qtaim.bcp1.r_e", "ext_report.bcp1.rho" = "qtaim.bcp1.rho", "ext_report.n_bcp" = "qtaim.n_bcp", "ext_report.n_ccp" = "qtaim.n_ccp", "ext_report.n_rcp" = "qtaim.n_rcp"}
"ext_report.bcp1.delta_r" = 0.0
"ext_report.bcp1.ellipticity" = -0.0
"ext_report.bcp1.laplacian" = -0.840816
"ext_report.bcp1.r_b" = 0.76
"ext_report.bcp1.r_e" = 1.4
"ext_report.bcp1.rho" = 0.255927
"ext_report.n_bcp" = 1.0
"ext_report.n_ccp" = 0.0
"ext_report.n_nacp" = 4.0
"ext_report.n_rcp" = 0.0

# Known oracle defects: each key is a quantity whose captured value is wrong, with what is wrong.
# The value stays as captured; tolerance() throws for it, so no parity comparison uses it.
[case.h2_qtaim.defects]
"ext_report.n_nacp" = "aimext reports 4 nuclear attractors for the 2 nuclei, and its own Poincaré-Hopf line reads N_NACP - N_BCP + N_RCP - N_CCP = 3 [INCOMPLETE / NON-CONVERGED]; the QTAIM step decides the correct count"

