# Deliberate bugs for the mutation smoke check (see run.jl). `file` is relative to QuantumEngine/;
# `find` must occur exactly once in it; `expect` is a regex matched against the names of the test
# items expected to fail.

# Unit conversions.

[[mutation]]
name = "angstrom-to-bohr-inverse"
file = "src/units/Units.jl"
find = 'const ANGSTROM_TO_BOHR = 1 / BOHR_TO_ANGSTROM'
replace = 'const ANGSTROM_TO_BOHR = 1 * BOHR_TO_ANGSTROM'
expect = "units: constants"

[[mutation]]
name = "au-to-debye-power"
file = "src/units/Units.jl"
find = 'SPEED_OF_LIGHT * 1.0e21'
replace = 'SPEED_OF_LIGHT * 1.0e20'
expect = "units: constants"

[[mutation]]
name = "gas-constant-product"
file = "src/units/Units.jl"
find = 'const GAS_CONSTANT_R = AVOGADRO_NA * BOLTZMANN_K'
replace = 'const GAS_CONSTANT_R = AVOGADRO_NA / BOLTZMANN_K'
expect = "units: constants"

# Electron counts and nuclear repulsion.

[[mutation]]
name = "nalpha-divisor"
file = "src/system/System.jl"
find = 'Int((n + u) / 2)'
replace = 'Int((n + u) / 3)'
expect = "electron counts"

[[mutation]]
name = "nuclear-repulsion-charge-product"
file = "src/system/System.jl"
find = 'Z_i * Z_j'
replace = 'Z_i + Z_j'
expect = "nuclear repulsion"

[[mutation]]
name = "spin-parity-check"
file = "src/system/System.jl"
find = 'isodd(d)'
replace = 'iseven(d)'
expect = "electron counts"

# The Rust exponent format.

[[mutation]]
name = "exponent-leading-zero"
file = "src/io/format.jl"
find = "while j < ncodeunits(s) && codeunit(s, j) == UInt8('0')"
replace = "while false"
expect = "Rust exponent format"

# The shell geometry of the basis.

[[mutation]]
name = "primitive-norm-four-alpha"
file = "src/basis/geometry.jl"
find = 'fourα = 4a'
replace = 'fourα = 2a'
expect = "basis: primitive norm"

[[mutation]]
name = "contraction-renorm-power"
file = "src/basis/geometry.jl"
find = 'for _ in 1:L'
replace = 'for _ in 1:(L - 1)'
expect = "basis: contraction renormalization"

[[mutation]]
name = "component-offset-l5"
file = "src/basis/geometry.jl"
find = 'const COMPONENT_OFFSETS = (0, 1, 4, 10, 20, 35)'
replace = 'const COMPONENT_OFFSETS = (0, 1, 4, 10, 20, 36)'
expect = "component order matches Rust"

[[mutation]]
name = "shell-pairs-inner-bound"
file = "src/basis/types.jl"
find = 'j < i ?'
replace = 'j < i - 1 ?'
expect = "basis: shells and pairs"
