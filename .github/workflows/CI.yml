name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.package }} on Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [PureMLIP, PureAtomistic]
        version: ['1.12', '1.13']
    steps:
      - uses: actions/checkout@v4
      # PureAtomistic's tests load checkpoints through PureMLIP's checkpoint cache.
      - name: Set the checkpoint cache
        if: matrix.package == 'PureAtomistic'
        run: echo "PUREMLIP_CHECKPOINT_DIR=$RUNNER_TEMP/checkpoints" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: PureMLIP
      - uses: julia-actions/julia-runtest@v1
        with:
          project: PureMLIP
          check_bounds: 'yes'
  pureblas:
    name: PureBLAS active (Julia 1.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Instantiate the PureBLAS test environment
        run: julia --project=PureMLIP/test/pureblas -e 'using Pkg; Pkg.instantiate()'
      - name: Run the tests with PureBLAS active
        run: julia --check-bounds=yes --project=PureMLIP/test/pureblas PureMLIP/test/pureblas/runtests.jl
  coverage:
    name: Coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [PureMLIP, PureAtomistic]
    steps:
      - uses: actions/checkout@v4
      - name: Set the checkpoint cache
        if: matrix.package == 'PureAtomistic'
        run: echo "PUREMLIP_CHECKPOINT_DIR=$RUNNER_TEMP/checkpoints" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: PureMLIP
      - uses: julia-actions/julia-runtest@v1
        with:
          project: PureMLIP
          check_bounds: 'yes'
          coverage: 'true'
      - name: Install coverage checker
        run: julia --project=PureMLIP/test/coverage -e 'using Pkg; Pkg.instantiate()'
      - name: Check per-file coverage thresholds
        run: julia --project=PureMLIP/test/coverage PureMLIP/test/coverage/check.jl
