name: Mutation
# Run by hand: each mutation runs the full test suite. For PureAtomistic that is 282 s per run, control
# included, so its 163 entries are split into four shards of about 41 entries (about 200 minutes
# each, under the 360-minute job limit). PureXC takes about 14 minutes per entry on an Apple
# M-series machine with five other runs in parallel (not measured on the CI runner), so its 78
# entries are split into five shards. QuantumEngine runs unsharded.
on:
  workflow_dispatch:
jobs:
  mutation:
    name: Mutation smoke check (${{ matrix.package }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: PureMLIP, shard: ''}
          - {package: PureAtomistic, shard: 1/4}
          - {package: PureAtomistic, shard: 2/4}
          - {package: PureAtomistic, shard: 3/4}
          - {package: PureAtomistic, shard: 4/4}
          - {package: PureTaylor, shard: ''}
          - {package: PureXC, shard: 1/5}
          - {package: PureXC, shard: 2/5}
          - {package: PureXC, shard: 3/5}
          - {package: PureXC, shard: 4/5}
          - {package: PureXC, shard: 5/5}
          - {package: QuantumEngine, shard: ''}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ matrix.package }}
      - name: Apply each mutation and run the suite
        env:
          PUREMLIP_CHECKPOINT_DIR: ${{ runner.temp }}/checkpoints
          MUTATION_SHARD: ${{ matrix.shard }}
        run: julia ${{ matrix.package }}/test/mutation/run.jl
      # PureTaylor and PureXC have no extension files; QuantumEngine's YAML extension is tested in its
      # main suite and has no :gpu mutation entries.
      - name: Apply each extension mutation and run the :gpu items on the CPU backend
        if: matrix.package != 'PureTaylor' && matrix.package != 'PureXC' && matrix.package != 'QuantumEngine'
        env:
          MUTATION_SUITE: gpu
          MUTATION_SHARD: ${{ matrix.shard }}
        run: julia ${{ matrix.package }}/test/mutation/run.jl
