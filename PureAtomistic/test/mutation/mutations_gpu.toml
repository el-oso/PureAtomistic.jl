find = "const _PHILOX_M0 = 0xD2511F53"
replace = "const _PHILOX_M0 = 0xD2511F55"
expect = "thermostats: Philox4x32-10 gives Random123's known-answer vectors"

[[mutation]]
name = "device-rng-philox-weyl-constant"
file = "ext/PureAtomisticGPUExt/philox.jl"
find = "const _PHILOX_W1 = 0xBB67AE85"
replace = "const _PHILOX_W1 = 0xBB67AE84"
expect = "thermostats: Philox4x32-10 gives Random123's known-answer vectors"

[[mutation]]
name = "device-rng-philox-permutation"
file = "ext/PureAtomisticGPUExt/philox.jl"
find = "return (hi1 ⊻ c[2] ⊻ k[1], lo1, hi0 ⊻ c[4] ⊻ k[2], lo0)"
