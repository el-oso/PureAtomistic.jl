find = "    _step!(sim.thermostat, sim)"
replace = "    _step!(nothing, sim)"
expect = "BAOAB|Bussi"

[[mutation]]
name = "langevin-splitting-order"
file = "src/thermostats/langevin.jl"
find = '''
    drift!(X, V, h / 2)
    for a in axes(V, 2)
        s = c3 / sqrt(m[a] * amu)
        for k in axes(V, 1)
            V[k, a] = c1 * V[k, a] + s * randn(rng, T)
        end
    end
    drift!(X, V, h / 2)
'''
replace = '''
    for a in axes(V, 2)
        s = c3 / sqrt(m[a] * amu)
        for k in axes(V, 1)
            V[k, a] = c1 * V[k, a] + s * randn(rng, T)
        end
    end
    drift!(X, V, h)
'''
expect = "BAOAB splitting order"

[[mutation]]
name = "gamma-cap-returns-value"
file = "src/thermostats/gamma_sampler.jl"
find = "    throw(ArgumentError(\"pureatomistic: the gamma sampler rejected"
replace = "    return d\n    throw(ArgumentError(\"pureatomistic: the gamma sampler rejected"
expect = "Marsaglia-Tsang gamma sampler"

[[mutation]]
name = "berendsen-sign"
file = "src/barostats/berendsen.jl"
find = "(T(b.P0) - P)"
replace = "(P - T(b.P0))"
expect = "relaxes"

[[mutation]]
name = "berendsen-cube-root"
file = "src/barostats/berendsen.jl"
find = "μ = cbrt(μ3)"
replace = "μ = μ3"
expect = "relaxes exponentially"

[[mutation]]
name = "berendsen-unit-factor"
file = "src/barostats/berendsen.jl"
find = "pressure(sys, stress(potential)) * T(EV_PER_A3_IN_GPA)"
replace = "pressure(sys, stress(potential))"
expect = "relaxes exponentially|ideal gas"

[[mutation]]
name = "berendsen-kinetic-term"
file = "src/systems/system.jl"
find = "return T(-tr / 3) + 2 * kinetic_energy(sys) / (3 * V)"
replace = "return T(-tr / 3)"
expect = "ideal gas"

[[mutation]]
name = "berendsen-stale-result"
file = "src/barostats/berendsen.jl"
find = '''
    prepare!(potential, sys.positions, sys.cell)
    energy_forces!(potential, sys.positions, sys.cell)
    return nothing'''
replace = '''
    return nothing'''
expect = "result of the rescaled configuration"

