# Deliberate bugs for the mutation smoke check (see run.jl). `file` is relative to PureAtomistic/;
# `find` must occur exactly once in it; `expect` is a regex matched against
# the names of the test items expected to fail.
# A source file that holds only module, `import`, `include`, `export` and `public` declarations
# needs no entry; every file that computes a value gets at least one.

[[mutation]]
name = "potential-capacity-fraction-ignored"
file = "src/potentials/contracts.jl"
find = 'extra_capacity = ceil(Int, fraction * m)'
replace = 'extra_capacity = 0'
expect = "MACEPotential equals mace_energy_forces exactly"

[[mutation]]
name = "potential-eltype-check-cell"
file = "src/potentials/contracts.jl"
find = '(eltype(positions) === T && eltype(cell) === T) ||'
replace = '(eltype(positions) === T) ||'
expect = "potential errors"

[[mutation]]
name = "potential-capacity-error-not-caught"
