# Deliberate bugs for the mutation smoke check (see run.jl). `file` is relative to PureMLIP/;
# `find` must occur exactly once in it; `expect` is a regex matched against
# the names of the test items expected to fail.

[[mutation]]
name = "e3nn-sign-rule"
file = "src/equivariant/e3nn.jl"
find = 's = iseven((l1 + l2 - l3) ÷ 2) ? 1.0 : -1.0'
replace = 's = iseven((l1 + l2 - l3) ÷ 2) ? -1.0 : 1.0'
expect = "e3nn_wigner_3j matches"

[[mutation]]
name = "e3nn-sqrt-4pi"
file = "src/equivariant/e3nn.jl"
find = '''
    _real_sh!(Y, nothing, v[fv + 2], v[fv], v[fv + 1], Int(lmax))
    c = sqrt(4 * T(π))'''
replace = '''
    _real_sh!(Y, nothing, v[fv + 2], v[fv], v[fv + 1], Int(lmax))
    c = sqrt(2 * T(π))'''
expect = "e3nn SH and gradient"

[[mutation]]
