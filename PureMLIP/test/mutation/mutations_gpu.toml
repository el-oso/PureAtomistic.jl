[[mutation]]
name = "device-messages-weight-path"
file = "ext/PureMLIPGPUExt/tensors/tensor_product.jl"
find = '''
$(sym(:w, p)) = w[u, $p, col]) for p in ps]...)
            $([:($(sym(:x, a)) = x[u, s, $a])'''
replace = '''
$(sym(:w, p)) = w[u, 1, col]) for p in ps]...)
            $([:($(sym(:x, a)) = x[u, s, $a])'''
expect = "forward: energy and node energies agree"

[[mutation]]
name = "device-messages-drop-earlier-chunks"
