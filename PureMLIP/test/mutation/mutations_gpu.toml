find = "for i in t:_REDUCE_GROUP:n"
replace = "for i in t:_REDUCE_GROUP:min(n, _REDUCE_GROUP)"
expect = "forward: the tree sum adds every entry"

[[mutation]]
name = "device-unknown-element-not-flagged"
file = "ext/PureMLIPGPUExt/evaluate.jl"
find = "    if iszero(s)\n"
replace = "    if false\n"
expect = "forward: an atomic number outside the device model's elements throws"

[[mutation]]
name = "device-zero-length-not-flagged"
