find = "act[q, j, l] = z * σ * cst"
replace = "act[q, j, l] = z * σ"
expect = "edge stages: each stage agrees with its CPU function"

[[mutation]]
name = "device-silu-slope"
file = "ext/PureMLIPGPUExt/radial.jl"
find = "g[q, j, s] *= cst * σ + act[q, j, l] * (one(σ) - σ)"
replace = "g[q, j, s] *= cst * σ + act[q, j, l] * σ"
expect = "edge stages: each stage agrees with its CPU function"

[[mutation]]
name = "device-zbl-derivative-sign"
