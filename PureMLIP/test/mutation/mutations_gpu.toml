[[mutation]]
name = "device-messages-one-receiver-per-work-item"
file = "ext/PureMLIPGPUExt/messages.jl"
find = "for i in (lo + il - 1):R:hi"
replace = "for i in (lo + il - 1):R:min(hi, lo + R - 1)"
expect = "forward: per-receiver kernels cover chunks"

[[mutation]]
name = "device-density-not-squared"
