[[mutation]]
name = "device-tree-sum-pairs"
file = "ext/PureMLIPGPUExt/reduce.jl"
find = "buf[t] += buf[t + h]"
replace = "buf[t] = buf[t + h]"
expect = "forward: the tree sum adds every entry"

[[mutation]]
name = "device-tree-sum-stride"
