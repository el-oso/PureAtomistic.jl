# Deliberate bugs for the extension files (see run.jl, MUTATION_SUITE=gpu). `file` is relative to PureMLIP/;
# the format is that of mutations.toml. A file that only declares its module needs no entry.

[[mutation]]
name = "device-reverse-edge-shift-sign"
file = "ext/PureMLIPGPUExt/device.jl"
find = "(nl.senders[e], nl.receivers[e], -nl.shifts[1, e], -nl.shifts[2, e], -nl.shifts[3, e])"
replace = "(nl.senders[e], nl.receivers[e], nl.shifts[1, e], -nl.shifts[2, e], -nl.shifts[3, e])"
expect = "device neighbor list: the CSR and the reverse map"

[[mutation]]
name = "device-row-ptr-start"
file = "ext/PureMLIPGPUExt/device.jl"
find = "    row_ptr[1] = 1\n"
replace = "    row_ptr[1] = 0\n"
expect = "device neighbor list: the CSR and the reverse map"

[[mutation]]
name = "device-species-map-ignores-elements"
file = "ext/PureMLIPGPUExt/device.jl"
find = "Int32[s in species ? s : 0 for s in model.species]"
replace = "Int32[s for s in model.species]"
expect = "device model: every parameter array is uploaded exactly"

[[mutation]]
name = "device-edge-vector-direction"
file = "ext/PureMLIPGPUExt/edges.jl"
find = "r[a, e] = positions[a, q] - positions[a, s] +"
replace = "r[a, e] = positions[a, s] - positions[a, q] +"
expect = "edge stages: each stage agrees with its CPU function"

[[mutation]]
name = "device-harmonics-gradient-projection-sign"
file = "ext/PureMLIPGPUExt/edges.jl"
find = "dY[k, 3, col] = c * ((gx - p * x) / r)"
replace = "dY[k, 3, col] = c * ((gx + p * x) / r)"
expect = "edge stages: each stage agrees with its CPU function"

[[mutation]]
name = "device-radial-agnesi-derivative-sign"
file = "ext/PureMLIPGPUExt/radial.jl"
find = "dt = -t^2 * du / r0"
replace = "dt = t^2 * du / r0"
expect = "edge stages: each stage agrees with its CPU function"

[[mutation]]
name = "device-radial-skin-shell-not-zero"
file = "ext/PureMLIPGPUExt/radial.jl"
find = "!(dd < P.r_max) && return"
replace = "!(dd < P.r_max + 1) && return"
expect = "edge stages: each stage agrees with its CPU function"

[[mutation]]
name = "device-radial-bessel-frequency"
