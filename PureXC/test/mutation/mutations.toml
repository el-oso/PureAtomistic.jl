# Deliberate bugs for the mutation smoke check (see run.jl). `file` is relative to PureXC/ (a path
# into ../PureTaylor names a file of the path dependency); `find` must occur exactly once in it;
# `expect` is a regex matched against the names of the test items (and, with `libxc = true`, the
# test sets of the Libxc comparison) expected to fail.

