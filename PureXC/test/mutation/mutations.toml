find = '_mul_operation(Val(max(L, length(b.c)) <= _INLINE_MAX), a, b)'
replace = '_mul_operation(Val(false), a, b)'
expect = "array loop vectorizes"

[[mutation]]
name = "taylor-inline-max"
file = "../PureTaylor/src/loops.jl"
find = 'const _INLINE_MAX = 21'
replace = 'const _INLINE_MAX = 5'
expect = "array loop vectorizes"
