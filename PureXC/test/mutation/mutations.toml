replace = 'for j in 1:K, a in 0:j'
expect = "field names and restricted values|polarized layout"

[[mutation]]
name = "layout-multiset-order"
file = "src/driver.jl"
find = 'if isempty(r) || r[1] >= i]'
replace = 'if isempty(r) || r[1] <= i]'
expect = "polarized layout"

# The change of variables to (n, ζ) of the polarized correlations: the series of ζ = (n_α − n_β)/n_r in
# the channel densities, and the scales of the substitution. The sign of ζ has no entry: ε_c and φ
# are even in ζ, so ζ = (n_β − n_α)/n_r gives the same function.

[[mutation]]
name = "pw92-zeta-variable"
file = "src/lda/pw92.jl"
find = 'ζ = (a - b) / nr'
replace = 'ζ = (a - b) / value(nr)'
expect = "reference values of the LDA functionals|LDA functionals agree with BigFloat"

[[mutation]]
name = "pw92-density-variable-scale"
file = "src/lda/pw92.jl"
find = 'substitute(n * ε, (nr / s, ζ))'
replace = 'substitute(n * ε, (nr / (2s), ζ))'
expect = "reference values of the LDA functionals|LDA functionals agree with BigFloat"

[[mutation]]
name = "pbe-c-zeta-variable"
file = "src/gga/pbe_c.jl"
find = 'ζ = (a - b) / nr'
replace = 'ζ = (a - b) / value(nr)'
expect = "reference values of the PBE functionals|PBE functionals agree with BigFloat"

[[mutation]]
name = "pbe-c-sigma-variable-scale"
file = "src/gga/pbe_c.jl"
find = 'substitute(n * w, (nr / sn, ζ, gt / st))'
replace = 'substitute(n * w, (nr / sn, ζ, gt / (2st)))'
expect = "reference values of the PBE functionals|PBE functionals agree with BigFloat"

# The overlap check of xc_evaluate!.

[[mutation]]
name = "overlap-span-touching"
file = "src/array.jl"
find = '_spans_intersect(sa::Tuple, sb::Tuple) = sa[1] < sb[2] && sb[1] < sa[2]'
replace = '_spans_intersect(sa::Tuple, sb::Tuple) = sa[1] <= sb[2] && sb[1] <= sa[2]'
expect = "array layer accepts disjoint views of one array as outputs|overlap test of views and Arrays|plain disjoint Arrays take the dense point loop"

[[mutation]]
name = "overlap-span-ignored"
file = "src/array.jl"
find = '    _spans_intersect(sa, sb) || return false'
replace = '    true || return false'
expect = "array layer accepts disjoint views of one array as outputs|overlap test of views and Arrays|plain disjoint Arrays take the dense point loop"

[[mutation]]
name = "overlap-index-sets"
file = "src/array.jl"
find = '_disjoint(i::_IntIndex, j::_IntIndex) = isempty(intersect(_steps(i), _steps(j)))'
replace = '_disjoint(i::_IntIndex, j::_IntIndex) = true'
expect = "array layer rejects outputs that share memory|overlap test of views and Arrays"

[[mutation]]
name = "overlap-shares-skipped"
file = "src/array.jl"
find = '_overlaps(a::AbstractArray, b::AbstractArray) = !(isempty(a) || isempty(b)) && _shares(a, b)'
replace = '_overlaps(a::AbstractArray, b::AbstractArray) = false'
expect = "array layer rejects outputs that share memory"

[[mutation]]
name = "overlap-zero-step-range"
file = "src/array.jl"
find = '_injective_index(r::AbstractRange) = length(r) <= 1 || !iszero(step(r))'
replace = '_injective_index(r::AbstractRange) = true'
expect = "array layer rejects views that leave their parent or overlap themselves"

[[mutation]]
name = "overlap-zero-stride-root"
file = "src/array.jl"
find = 'n <= 1 || !iszero(s), zip(size(a), strides(a)))'
replace = 'true, zip(size(a), strides(a)))'
expect = "array layer rejects outputs whose root repeats an address by a zero stride"

[[mutation]]
name = "overlap-dataids"
file = "src/array.jl"
