# The σαβ bound |σαβ| ≤ √σαα·√σββ·(1 + 8 eps), in the check and in its branch-free twin.

[[mutation]]
name = "sigma-ab-bound-check"
file = "src/validate.jl"
find = 'abs(ab) > sqrt(aa) * sqrt(bb) * (1 + 8 * eps(S))'
replace = 'abs(ab) > sqrt(aa) * sqrt(bb) * (1 + 32 * eps(S))'
expect = "the σαβ bound"

[[mutation]]
name = "sigma-ab-bound-predicate"
file = "src/validate.jl"
find = 'fast_sqrt(abs(bb)) * (1 + 8 * eps(S))'
replace = 'fast_sqrt(abs(bb)) * (1 + 32 * eps(S))'
expect = "the input predicate agrees with the input checks"

# The output layout: field order by descending density order, and the polarized entries in
# lexicographic multiset order.

[[mutation]]
