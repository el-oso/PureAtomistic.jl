# Threshold comparisons of the rules (`<` against `≤`) and the σ floor, the square of the reported
# threshold.

[[mutation]]
name = "lda-x-cutoff-restricted"
file = "src/lda/lda_x.jl"
find = 'ρ / 2 <= f.thresholds.density'
replace = 'ρ / 2 < f.thresholds.density'
expect = "lda_x per-channel rule"

# lda_x's polarized rule 1 (n_α + n_β < n_thr) has no entry: where n_α + n_β = n_thr each channel is
# at most n_thr, so its per-channel rule (`lda-x-channel-rule`) gives exact zeros either way.

[[mutation]]
name = "lda-x-channel-rule"
file = "src/lda/lda_x.jl"
find = 'ifelse(value(ρσ) <= thr, zero(t), t)'
replace = 'ifelse(value(ρσ) < thr, zero(t), t)'
expect = "lda_x per-channel rule"

[[mutation]]
name = "pw92-cutoff-restricted"
file = "src/lda/pw92.jl"
find = '_cutoff(pw::PW92Correlation, ρ::Real) = ρ < pw.thresholds.density'
replace = '_cutoff(pw::PW92Correlation, ρ::Real) = ρ <= pw.thresholds.density'
expect = "LDA cut-off at the density threshold"

[[mutation]]
name = "pw92-cutoff-polarized"
file = "src/lda/pw92.jl"
find = 'ρ[1] + ρ[2] < pw.thresholds.density'
replace = 'ρ[1] + ρ[2] <= pw.thresholds.density'
expect = "LDA cut-off at the density threshold"

[[mutation]]
name = "pw92-zeta-factor-strict"
file = "src/lda/pw92.jl"
find = 'ifelse(value(y) < εζ, zero(t) + εζ * fast_cbrt(εζ), t)'
replace = 'ifelse(value(y) <= εζ, zero(t) + εζ * fast_cbrt(εζ), t)'
expect = "PW92 ζ-factor at the rounded 1 − ζ = ε_ζ"

[[mutation]]
name = "pbe-x-cutoff-restricted"
