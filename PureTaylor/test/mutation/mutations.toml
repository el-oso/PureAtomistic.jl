# The scale handling of `derivatives`.

[[mutation]]
name = "derivatives-factorial"
file = "src/type.jl"
find = ':($T($(prod(factorial, α))))'
replace = ':($T($(prod(α))))'
expect = "closed-form derivatives"

[[mutation]]
name = "derivatives-invscale-variable"
file = "src/type.jl"
find = 'push!(scale.args, :(invscale[$i]))'
replace = 'push!(scale.args, :(invscale[1]))'
expect = "seeds and read-out"
