# Deliberate bugs for the mutation smoke check (see run.jl). `file` is relative to PureTaylor/;
# `find` must occur exactly once in it; `expect` is a regex matched against
# the names of the test items expected to fail.

# The product: which pairs of stored indices contribute to each output coefficient.

[[mutation]]
name = "product-degree-limit"
file = "src/arith.jl"
find = 'sum(α) <= D || return :(zero(T))'
replace = 'sum(α) < D || return :(zero(T))'
expect = "product equals the dense product|degree-limited product"

[[mutation]]
name = "product-index-difference"
file = "src/arith.jl"
find = 'γ = α .- β'
replace = 'γ = β .- α'
expect = "product equals the dense product"

[[mutation]]
name = "product-skip-constant-term"
file = "src/arith.jl"
find = 'skip0 && i == 1 && continue'
replace = 'skip0 && i == 2 && continue'
expect = "degree-limited product"

# Integer powers by repeated squaring.

[[mutation]]
name = "power-odd-bit"
file = "src/arith.jl"
find = 'isodd(n) && (r *= x)'
replace = 'iseven(n) && (r *= x)'
expect = "powers \\(exact\\)"

[[mutation]]
name = "literal-power-non-integer"
file = "src/arith.jl"
find = 'n isa Integer || return :(a^$n)'
replace = 'n isa Real || return :(a^$n)'
expect = "literal_pow with a non-integer exponent"

[[mutation]]
name = "literal-power-negative"
file = "src/arith.jl"
find = 'push!(body.args, n < 0 ? :(inv(r)) : :r)'
replace = 'push!(body.args, :r)'
expect = "powers \\(exact\\)"

# The Horner composition.

[[mutation]]
name = "horner-degree-limit"
file = "src/univariate.jl"
find = 'Val(true), Val($(K - j))'
replace = 'Val(true), Val($(K - j - 1))'
expect = "compose equals the sum of powers"

[[mutation]]
name = "horner-coefficient-index"
file = "src/univariate.jl"
find = ') + d[$(j + 1)]'
replace = ') + d[$(j + 2)]'
expect = "compose equals the sum of powers"

