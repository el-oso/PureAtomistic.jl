find = 'const LOG_COEFFS64 = ntuple(j -> 2 / (2j + 1), 9)'
replace = 'const LOG_COEFFS64 = ntuple(j -> 2 / (2j + 3), 9)'
expect = "log Float64"

[[mutation]]
