# LN2_LO is computed from LN2_HI, so a change of LN2_HI alone keeps LN2_HI + LN2_LO = ln 2. The
# LN2_HI entries therefore edit both lines: LN2_HI changes (keeping its trailing zero bits) and
# LN2_LO stays the value derived from the correct LN2_HI, so the sum is no longer ln 2.
[[mutation]]
name = "ln2-high-part-64"
file = "src/fast.jl"
find = '''
const LN2_HI64 = reinterpret(Float64, 0x3fe62e42fee00000)
const LN2_LO64 = Float64(log(big(2)) - big(LN2_HI64))'''
replace = '''
const LN2_HI64 = reinterpret(Float64, 0x3fe62e42fef00000)
const LN2_LO64 = Float64(log(big(2)) - big(reinterpret(Float64, 0x3fe62e42fee00000)))'''
expect = "log Float64|exp Float64"

[[mutation]]
name = "ln2-high-part-32"
file = "src/fast.jl"
find = '''
const LN2_HI32 = reinterpret(Float32, 0x3f317200)
const LN2_LO32 = Float32(log(big(2)) - big(LN2_HI32))'''
replace = '''
const LN2_HI32 = reinterpret(Float32, 0x3f317300)
const LN2_LO32 = Float32(log(big(2)) - big(reinterpret(Float32, 0x3f317200)))'''
expect = "log Float32, sampled|exp Float32, sampled"

[[mutation]]
name = "ln2-low-part-32"
file = "src/fast.jl"
find = 'const LN2_LO32 = Float32(log(big(2)) - big(LN2_HI32))'
replace = 'const LN2_LO32 = 0.0f0'
expect = "fast functions on Taylor numbers agree"

[[mutation]]
name = "exp-reduction-inverse-ln2-32"
file = "src/fast.jl"
find = 'const INV_LN2_32 = Float32(1 / log(big(2)))'
replace = 'const INV_LN2_32 = Float32(1 / log(big(3)))'
expect = "exp Float32, sampled|expm1 Float32, sampled"

[[mutation]]
name = "log-reduction-midpoint-32"
